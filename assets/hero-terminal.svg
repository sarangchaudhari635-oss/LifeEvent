<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="380">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BAF2"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#002E6E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 4px #10b981); }
      50% { opacity: 0.3; transform: scale(0.85); filter: drop-shadow(0 0 1px #10b981); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes typeLine1 { 0% { opacity: 0; } 5% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes typeLine2 { 0%, 15% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes typeLine3 { 0%, 30% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes typeLine4 { 0%, 45% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes typeLine5 { 0%, 60% { opacity: 0; } 65% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes typeLine6 { 0%, 75% { opacity: 0; } 80% { opacity: 1; } 100% { opacity: 1; } }

    .pulse { animation: pulseDot 1.8s infinite ease-in-out; transform-origin: 830px 24px; }
    .cursor { animation: blinkCursor 0.85s infinite; }
    .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; }
    .t1 { animation: typeLine1 10s infinite; }
    .t2 { animation: typeLine2 10s infinite; }
    .t3 { animation: typeLine3 10s infinite; }
    .t4 { animation: typeLine4 10s infinite; }
    .t5 { animation: typeLine5 10s infinite; }
    .t6 { animation: typeLine6 10s infinite; }
  </style>

  <!-- Container Box with glowing border -->
  <rect x="5" y="5" width="890" height="370" rx="14" fill="url(#termGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="5" y="5" width="890" height="370" rx="14" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" opacity="0.6"/>

  <!-- Terminal Header Bar -->
  <path d="M 5 19 Q 5 5 19 5 L 881 5 Q 895 5 895 19 L 895 44 L 5 44 Z" fill="#0b1120" stroke="#1e293b" stroke-width="0.5"/>
  
  <!-- Window Controls -->
  <circle cx="30" cy="24" r="6" fill="#ef4444"/>
  <circle cx="50" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="24" r="6" fill="#10b981"/>

  <!-- Title Center -->
  <text x="450" y="29" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    ⚡ PAYTM LIFEEVENT AI — AUTONOMOUS EMERGENCY DISPATCH &amp; TPA ARBITRATION
  </text>

  <!-- Live Pulse Dot & Badge -->
  <circle cx="825" cy="24" r="4.5" fill="#10b981" class="pulse"/>
  <text x="838" y="28" fill="#10b981" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700">ONLINE</text>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Ingestion Prompt -->
  <g class="t1">
    <text x="30" y="80" class="code" fill="#38bdf8">captain@paytm-ai:~$</text>
    <text x="195" y="80" class="code" fill="#f8fafc">lifeevent-ai dispatch --hospital "Ruby Hall Clinic, Pune" --patient "Ramesh Kulkarni"</text>
  </g>

  <!-- Line 2: Pipeline initialization -->
  <g class="t2">
    <text x="30" y="115" class="code" fill="#64748b">[00:00:00.082]</text>
    <text x="145" y="115" class="code" fill="#10b981">✓</text>
    <text x="165" y="115" class="code" fill="#cbd5e1"><tspan fill="#38bdf8">VERHOEFF PRIVACY:</tspan> Client-side Aadhaar checksum validated. Masked to <tspan fill="#fbbf24">XXXXXXXX4821</tspan> (Zero PII transmitted)</text>
  </g>

  <!-- Line 3: Multimodal Extraction -->
  <g class="t3">
    <text x="30" y="150" class="code" fill="#64748b">[00:00:00.245]</text>
    <text x="145" y="150" class="code" fill="#10b981">✓</text>
    <text x="165" y="150" class="code" fill="#cbd5e1"><tspan fill="#a855f7">GEMINI 2.0 VISION:</tspan> Policy parsed (Star Comprehensive, ₹5,00,000 Sum Insured, Room Rent: Single Private)</text>
  </g>

  <!-- Line 4: IRDAI Deterministic Engine -->
  <g class="t4">
    <text x="30" y="185" class="code" fill="#64748b">[00:00:00.410]</text>
    <text x="145" y="185" class="code" fill="#eab308">⚡</text>
    <text x="165" y="185" class="code" fill="#cbd5e1"><tspan fill="#f59e0b">IRDAI 2024 ENGINE:</tspan> Clause 7.2 Pro-Rata Room Rent Deduction applied: <tspan fill="#ef4444">₹1,87,500 Out-of-Pocket Gap</tspan></text>
  </g>

  <!-- Line 5: Paytm Rails Liquidity -->
  <g class="t5">
    <text x="30" y="220" class="code" fill="#64748b">[00:00:00.580]</text>
    <text x="145" y="220" class="code" fill="#00BAF2">★</text>
    <text x="165" y="220" class="code" fill="#cbd5e1"><tspan fill="#00BAF2">PAYTM LIQUIDITY:</tspan> Instant ₹50,000 Caution Deposit Bridge ready via Paytm UPI / Emergency Credit Line</text>
  </g>

  <!-- Line 6: Summary Box -->
  <g class="t6">
    <rect x="30" y="250" width="840" height="90" rx="8" fill="#08101e" stroke="#00BAF2" stroke-width="1.2" stroke-dasharray="5,5"/>
    <text x="50" y="280" class="code" fill="#00BAF2" font-weight="700">STATUS: READY FOR HOSPITAL ADMISSION COUNTER</text>
    <text x="50" y="305" class="code" fill="#94a3b8">Estimated Bill: ₹4,50,000 | TPA Pre-Auth: ₹2,20,000 | Out-of-Pocket: ₹1,87,500 | Paytm Bridge: ₹50,000</text>
    <text x="50" y="325" class="code" fill="#10b981" font-weight="600">Family Delay Eliminated: 3.5 Hours saved • Zero treatment stoppage • 100% Deterministic Math</text>
  </g>

  <!-- Blinking Terminal Prompt -->
  <text x="30" y="360" class="code" fill="#38bdf8">captain@paytm-ai:~$</text>
  <rect x="195" y="348" width="8" height="15" fill="#00BAF2" class="cursor"/>
</svg>
